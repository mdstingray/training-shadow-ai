<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Approved tools vs Shadow AI</title>
  <desc id="desc">Diagram: secured corporate path on the left, personal unapproved tool on the right.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2744"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a0d0d"/>
      <stop offset="100%" stop-color="#1a1010"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#0070e0"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#0d0d0d"/>
  <rect x="24" y="28" width="280" height="304" rx="16" fill="url(#g1)" stroke="#1e3a5f" stroke-width="2" filter="url(#shadow)"/>
  <rect x="336" y="28" width="280" height="304" rx="16" fill="url(#g2)" stroke="#5c2a2a" stroke-width="2" filter="url(#shadow)"/>
  <text x="164" y="58" text-anchor="middle" fill="#41c3ff" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">Company (IT / SSO)</text>
  <text x="476" y="58" text-anchor="middle" fill="#f87171" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">Unapproved (Shadow AI)</text>
  <rect x="56" y="88" width="216" height="72" rx="10" fill="#0f172a" stroke="#0070e0" stroke-width="2"/>
  <text x="164" y="118" text-anchor="middle" fill="#e5e7eb" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Stingray corporate account</text>
  <text x="164" y="142" text-anchor="middle" fill="#93c5fd" font-family="system-ui,Segoe UI,sans-serif" font-size="12">SSO · approved tools</text>
  <rect x="56" y="180" width="216" height="56" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="164" y="212" text-anchor="middle" fill="#bbf7d0" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Data under known controls</text>
  <path d="M164 160 v20" stroke="#0070e0" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="368" y="88" width="216" height="72" rx="10" fill="#1f1010" stroke="#ef4444" stroke-width="2"/>
  <text x="476" y="118" text-anchor="middle" fill="#fecaca" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Personal account</text>
  <text x="476" y="142" text-anchor="middle" fill="#fca5a5" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Free chat · not IT-approved</text>
  <rect x="368" y="180" width="216" height="56" rx="8" fill="#2a1515" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="476" y="212" text-anchor="middle" fill="#fecaca" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Low visibility for IT</text>
  <path d="M476 160 v20" stroke="#ef4444" stroke-width="2"/>
  <text x="320" y="300" text-anchor="middle" fill="#9ca3af" font-family="system-ui,Segoe UI,sans-serif" font-size="11">Shadow AI = work-related AI use outside the approved boundary.</text>
</svg>
