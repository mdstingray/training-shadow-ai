<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow AI — Formation Stingray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0e;
  --bg-elevated:#141418;
  --accent:#0070e0;
  --accent-hover:#0088ff;
  --highlight:#5ad0ff;
  --text:#f4f4f5;
  --text-muted:#a1a1aa;
  --card:rgba(24,24,28,.85);
  --card-border:rgba(255,255,255,.08);
  --correct:#22c55e;
  --wrong:#f87171;
  --radius:14px;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --shadow-sm:0 2px 8px rgba(0,0,0,.35);
  --shadow-md:0 8px 32px rgba(0,0,0,.45);
  --blur-card:blur(12px);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .module,.question-block,.intro,.results-card,.feedback.show,.rationale-box,.error-screen{animation:none!important}
  .module-figure:hover .module-illustration{transform:none!important}
  .opt-btn:hover:not(:disabled),.nav-btn:hover:not(:disabled),.start-btn:hover,.restart-btn:hover{transform:none!important}
  .scenario-card:hover{transform:none!important}
  .progress-fill{transition-duration:.25s!important}
}
body{
  font-family:'Outfit',system-ui,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 100% 80% at 50% -30%,rgba(0,112,224,.18),transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 20%,rgba(90,208,255,.07),transparent 50%),
    radial-gradient(ellipse 50% 40% at 0% 80%,rgba(0,112,224,.05),transparent 45%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  line-height:1.65;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.desktop-paged{overflow-x:hidden;overflow-y:auto}
a{color:var(--highlight);transition:color .2s var(--ease-out)}
a:hover{color:#7ddbff}

.app{max-width:1100px;margin:0 auto;padding:18px 22px 24px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
#main{flex:1;display:flex;min-height:0;overflow:auto;padding-bottom:4px}

.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 18px;margin-bottom:4px;flex-wrap:wrap;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:saturate(1.2);
}
.header h1{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;color:#f4f4f5;text-shadow:0 0 40px rgba(90,208,255,.15)}
.header-right{display:flex;align-items:center;gap:12px}
.user-badge{font-size:.78rem;color:var(--text-muted);background:rgba(255,255,255,.06);padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.06)}
.lang-toggle{display:flex;gap:0;border:1px solid rgba(255,255,255,.12);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.25)}
.lang-btn{background:transparent;color:var(--text);border:none;padding:7px 16px;cursor:pointer;font-size:.82rem;font-weight:600;transition:background .25s var(--ease-out),color .2s;font-family:inherit}
.lang-btn.active{background:linear-gradient(180deg,var(--accent),#0058b8);color:#fff;box-shadow:0 2px 8px rgba(0,112,224,.35)}
.lang-btn:not(.active):hover{background:rgba(255,255,255,.06)}

.progress-wrap{margin-bottom:18px}
.progress-label{font-size:.78rem;color:var(--text-muted);margin-bottom:8px;display:flex;justify-content:space-between;letter-spacing:.02em}
.progress-bar{height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent) 0%,var(--highlight) 55%,#7ddbff 100%);
  border-radius:999px;
  transition:width .65s var(--ease-out);
  box-shadow:0 0 20px rgba(90,208,255,.35);
}

.module{display:none;animation:moduleIn .45s var(--ease-out) both;flex:1;min-height:0}
.module.active{display:flex;flex-direction:column}
@keyframes moduleIn{from{opacity:0;transform:translateY(16px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes stageSlide{
  from{opacity:0;transform:translateX(14px) scale(.992)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
.module-shell{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;overflow:visible}
.module-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.module-meta-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.step-track{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.step-dot{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  color:var(--text-muted);
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.02em;
  transition:transform .22s var(--ease-out),border-color .22s var(--ease-out),background .22s var(--ease-out),color .22s var(--ease-out),box-shadow .22s var(--ease-out);
}
.step-dot::before{
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
.step-dot.done{
  color:#dff6e7;
  border-color:rgba(34,197,94,.2);
  background:rgba(34,197,94,.09);
}
.step-dot.done::before{background:var(--correct)}
.step-dot.current{
  color:#fff;
  border-color:rgba(90,208,255,.36);
  background:linear-gradient(180deg,rgba(0,112,224,.24),rgba(90,208,255,.12));
  box-shadow:0 8px 24px rgba(0,112,224,.16);
  transform:translateY(-1px);
}
.step-dot.current::before{
  background:var(--highlight);
  box-shadow:0 0 14px rgba(90,208,255,.7);
}
.step-caption{font-size:.82rem;color:var(--text-muted)}
.stage-pill{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;padding:8px 14px;font-size:.78rem;font-weight:700;
  color:var(--highlight);background:rgba(0,112,224,.12);border:1px solid rgba(90,208,255,.22);
  white-space:nowrap;
}
.stage-card{
  background:var(--card);
  backdrop-filter:var(--blur-card);
  -webkit-backdrop-filter:var(--blur-card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  flex:1;
  min-height:0;
  overflow:auto;
  position:relative;
  animation:stageSlide .38s var(--ease-out) both;
}
.stage-card::before{
  content:'';
  position:absolute;
  inset:0 0 auto 0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(90,208,255,.38),transparent);
  pointer-events:none;
}
.module-tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--highlight);margin-bottom:6px;font-weight:700;opacity:.95}
.module h2{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.module-content{
  background:var(--card);
  backdrop-filter:var(--blur-card);
  -webkit-backdrop-filter:var(--blur-card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:22px 22px 20px;
  margin-bottom:28px;
  font-size:.95rem;
  line-height:1.75;
  box-shadow:var(--shadow-md);
  transition:box-shadow .3s var(--ease-out),border-color .3s;
}
.module-content:hover{border-color:rgba(90,208,255,.12)}
.module-content p{margin-bottom:12px}
.module-content p:last-child{margin-bottom:0}
.module-content ul,.module-content ol{padding-left:20px;margin-bottom:12px}
.module-content li{margin-bottom:6px}
.module-screen{
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:20px 22px;
  height:100%;
  min-height:0;
}
.module-copy{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;overflow:visible}
.module-content--paged{
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border:none;
  border-radius:0;
  padding:0;
  margin:0;
  box-shadow:none;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:100%;
  overflow:auto;
  padding-right:6px;
  min-width:0;
}
.module-content--paged:hover{border-color:transparent}
.module-content--paged p,.module-content--paged ul,.module-content--paged ol{margin-bottom:0}
.module-content--paged ul,.module-content--paged ol{padding-left:20px}
.module-content--paged .scenario-card,
.module-content--paged .key-msg,
.module-content--paged .module-figure{margin:0}
.module-content--paged .module-illustration{max-height:148px;object-fit:contain}
.module-content--paged .module-figure figcaption{max-width:none}
.module-side-note{
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.025));
  padding:18px;
  min-height:100%;
  display:flex;
  flex-direction:column;
  gap:16px;
  justify-content:space-between;
}
.module-side-note h3{font-size:.84rem;letter-spacing:.12em;text-transform:uppercase;color:var(--highlight)}
.module-side-note p{font-size:.9rem;color:var(--text-muted);line-height:1.65}
.module-side-note strong{color:var(--text)}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.mini-stat{
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  padding:12px 14px;
}
.mini-stat span{
  display:block;
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--text-muted);
  margin-bottom:8px;
  font-weight:700;
}
.mini-stat strong{font-size:1.02rem;font-weight:800}
.mini-stat--wide{grid-column:1 / -1}
.key-msg{
  background:linear-gradient(90deg,rgba(0,112,224,.14),rgba(90,208,255,.06));
  border-left:4px solid var(--accent);
  padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0;font-size:.9rem;
  box-shadow:var(--shadow-sm);
}

.scenario-card{
  background:rgba(18,18,22,.9);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  padding:18px 20px;margin:18px 0;
  border-left:4px solid var(--highlight);
  box-shadow:var(--shadow-sm);
  transition:transform .3s var(--ease-out),border-color .3s;
}
.scenario-card:hover{transform:translateY(-1px);border-color:rgba(90,208,255,.15)}
.scenario-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--highlight);margin-bottom:10px;font-weight:800}
.scenario-card .scenario-q{margin-top:12px;color:var(--text-muted);font-size:.93rem}
.module-figure{margin:22px 0;text-align:center}
.module-illustration{
  width:100%;max-width:640px;height:auto;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#08080a;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  transition:transform .4s var(--ease-out),box-shadow .4s;
}
.module-figure:hover .module-illustration{transform:scale(1.01);box-shadow:0 16px 48px rgba(0,112,224,.12)}
.module-figure figcaption{font-size:.82rem;color:var(--text-muted);margin-top:12px;line-height:1.55;max-width:640px;margin-left:auto;margin-right:auto}
.module-spacer{margin-top:30px;margin-bottom:10px;padding-top:20px;border-top:1px dashed rgba(255,255,255,.1)}
.spacer-heading{font-size:1.08rem;font-weight:700;color:var(--highlight);margin-bottom:12px;letter-spacing:-.02em}
.spacer-lead{margin-top:14px;color:var(--text-muted);font-size:.93rem}

.rationale-box{
  margin-top:16px;padding:16px 18px;border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(12,12,14,.6);
  backdrop-filter:blur(8px);
  animation:fadeIn .35s var(--ease-out) both;
}
.rationale-h{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:12px;font-weight:700}
.rationale-ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rationale-item{
  display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  transition:background .25s var(--ease-out),border-color .25s;
}
.rationale-item.is-correct{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.rationale-item.is-wrong-choice{border-color:rgba(248,113,113,.45);background:rgba(239,68,68,.1)}
.r-m{flex-shrink:0;width:24px;text-align:center;font-weight:800;color:var(--text-muted);margin-top:1px;font-size:.95rem}
.rationale-item.is-correct .r-m{color:var(--correct)}
.rationale-item.is-wrong-choice .r-m{color:var(--wrong)}
.r-opt{font-weight:600;font-size:.89rem;color:#ececec;margin-bottom:5px;line-height:1.38}
.r-expl{font-size:.86rem;color:var(--text-muted);line-height:1.58}

.question-block{
  background:var(--card);
  backdrop-filter:var(--blur-card);
  -webkit-backdrop-filter:var(--blur-card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
  animation:fadeIn .4s var(--ease-out) both;
}
.question-block h3{font-size:1.02rem;font-weight:700;margin-bottom:16px;line-height:1.5;letter-spacing:-.02em}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{
  font-family:inherit;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:14px 18px;color:var(--text);font-size:.9rem;font-weight:500;
  cursor:pointer;text-align:left;
  transition:transform .22s var(--ease-out),border-color .22s,background .22s,box-shadow .22s;
  line-height:1.45;
}
.opt-btn:hover:not(:disabled){
  border-color:rgba(0,112,224,.55);
  background:rgba(0,112,224,.12);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,112,224,.15);
}
.opt-btn:focus-visible{outline:2px solid var(--highlight);outline-offset:2px}
.opt-btn:disabled{cursor:default}
.opt-btn.selected-correct{border-color:rgba(34,197,94,.65);background:rgba(34,197,94,.14);box-shadow:0 0 0 1px rgba(34,197,94,.2)}
.opt-btn.selected-wrong{border-color:rgba(248,113,113,.6);background:rgba(239,68,68,.12)}
.opt-btn.reveal-correct{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.feedback{margin-top:14px;padding:14px 18px;border-radius:12px;font-size:.89rem;line-height:1.55;display:none;animation:fadeIn .3s var(--ease-out)}
.feedback.show{display:block}
.feedback.correct{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#a7f3d0}
.feedback.wrong{background:rgba(239,68,68,.12);border:1px solid rgba(248,113,113,.35);color:#fecaca}
.question-screen{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:16px;
  padding:20px 22px;
  align-items:start;
}
.question-main{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.question-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;order:-1}
.question-stat{
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  padding:16px 18px;
}
.question-stat-label{
  display:block;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--text-muted);
  margin-bottom:8px;
  font-weight:700;
}
.question-stat-value{font-size:1.1rem;font-weight:800;color:var(--text)}
.single-question{
  margin-bottom:0;
  box-shadow:none;
  background:rgba(10,10,12,.32);
  max-height:100%;
  overflow:auto;
  padding-right:16px;
  position:relative;
}
.question-intro{
  margin-bottom:18px;
  padding-bottom:18px;
  border-bottom:1px dashed rgba(255,255,255,.1);
}
.single-question::before{
  content:'';
  position:sticky;
  top:0;
  display:block;
  height:1px;
  margin:-22px -22px 18px;
  background:linear-gradient(90deg,rgba(0,112,224,.55),rgba(90,208,255,.08));
}
.interstitial-screen{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  min-height:100%;
}
.interstitial-screen .module-content{margin:0;max-width:780px;width:100%;max-height:100%;overflow:auto;padding-right:6px}
.interstitial-screen .module-spacer{padding-top:0;margin:0;border-top:none}
.intro-slide-screen{
  display:block;
  padding:28px 36px;
}
.intro-slide-body{
  width:100%;
  font-size:1.05rem;
  line-height:1.7;
  color:var(--text);
}
.intro-slide-body h3{
  font-size:1.5rem;
  font-weight:800;
  color:var(--highlight);
  margin-bottom:14px;
  letter-spacing:-.02em;
  line-height:1.2;
}
.intro-slide-body p{margin-bottom:14px;font-size:1.05rem;line-height:1.7}
.intro-slide-body p:last-child{margin-bottom:0}
.intro-slide-body ul,.intro-slide-body ol{padding-left:22px;margin-bottom:14px;font-size:1.04rem;line-height:1.65}
.intro-slide-body li{margin-bottom:10px}
.intro-slide-body strong{color:var(--text);font-weight:700}
.intro-slide-body .scenario-card,
.intro-slide-body .key-msg{margin:14px 0;font-size:1.02rem;padding:18px 22px;line-height:1.65}
.intro-slide-body .scenario-card ul{margin-bottom:0}
.intro-slide-body .module-figure{margin:0;text-align:center}
.intro-slide-body .module-illustration{max-height:320px;object-fit:contain;width:100%}

.intro-layout{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);
  gap:32px;
  align-items:center;
  width:100%;
}
.intro-layout--text-only{grid-template-columns:minmax(0,1fr);max-width:820px;margin:0 auto}
.intro-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.intro-media{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-width:0;
}
.intro-media img{
  width:100%;
  max-width:420px;
  max-height:320px;
  object-fit:contain;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 14px 40px rgba(0,0,0,.45);
  background:#08080a;
  transition:transform .4s var(--ease-out);
}
.intro-media img:hover{transform:scale(1.01)}
.intro-media figcaption{
  font-size:.82rem;
  color:var(--text-muted);
  line-height:1.55;
  text-align:center;
  max-width:420px;
}

.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding:24px 0 12px;gap:14px}
.nav-btn{
  font-family:inherit;
  background:linear-gradient(180deg,var(--accent-hover),var(--accent));
  color:#fff;border:none;border-radius:12px;
  padding:14px 28px;font-size:.94rem;font-weight:700;
  cursor:pointer;
  transition:transform .2s var(--ease-out),box-shadow .25s,filter .2s;
  box-shadow:0 4px 16px rgba(0,112,224,.35);
}
.nav-btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 28px rgba(0,112,224,.4);transform:translateY(-1px)}
.nav-btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.nav-btn.is-ready:not(:disabled){animation:readyPulse 2.4s ease-in-out infinite}
.nav-btn:disabled{
  background:#2a2a2e;color:#71717a;cursor:not-allowed;
  box-shadow:none;filter:none;transform:none;
}
.nav-btn.secondary{
  background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text-muted);
  box-shadow:none;
}
.nav-btn.secondary:hover:not(:disabled){
  border-color:rgba(90,208,255,.4);color:#fff;background:rgba(255,255,255,.04);
}

.score-display{text-align:center;font-size:.88rem;color:var(--text-muted);padding:8px 0}
@keyframes readyPulse{
  0%,100%{box-shadow:0 4px 16px rgba(0,112,224,.35)}
  50%{box-shadow:0 8px 28px rgba(90,208,255,.45)}
}

.results-card{
  background:var(--card);
  backdrop-filter:var(--blur-card);
  border:1px solid var(--card-border);

let lang = 'fr';
let currentModule = -1;
let currentStep = 0;
let answers = [];
let totalQuestions = 0;
let userCode = null;
let userData = null;
let quizData = null;
let serverModules = [];
let moduleStartTime = 0;
let submittedModules = new Set();

function storageKey() { return userCode ? 'quiz_state_' + userCode : null; }

function saveState() {
  const k = storageKey();
  if (!k) return;
  try {
    sessionStorage.setItem(k, JSON.stringify({
      currentModule, currentStep, answers, submittedModules: [...submittedModules], lang
    }));
  } catch(e) {}
}

function loadState() {
  const k = storageKey();
  if (!k) return false;
  try {
    const raw = sessionStorage.getItem(k);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.answers && s.answers.length > 0) {
      answers = s.answers;
      currentModule = s.currentModule != null ? s.currentModule : -1;
      currentStep = typeof s.currentStep === 'number' ? s.currentStep : 0;
      submittedModules = new Set(s.submittedModules || []);
      if (s.lang) { lang = s.lang; }
      return true;
    }
  } catch(e) {}
  return false;
}

function clearState() {
  const k = storageKey();
  if (k) try { sessionStorage.removeItem(k); } catch(e) {}
}

function t() { return QUIZ_DATA[lang]; }

function buildRationaleHtml(question, prev) {
  if (!question.explain_opts || question.explain_opts.length !== question.opts.length) return '';
  const d = t();
  const items = question.explain_opts.map((expl, i) => {
    let cls = 'rationale-item';
    if (i === question.correct) cls += ' is-correct';
    else if (prev && i === prev.selectedOpt) cls += ' is-wrong-choice';
    let mark = '·';
    if (i === question.correct) mark = '✓';
    else if (prev && i === prev.selectedOpt) mark = '→';
    return `<li class="${cls}"><span class="r-m">${mark}</span><div><div class="r-opt">${question.opts[i]}</div><div class="r-expl">${expl}</div></div></li>`;
  }).join('');
  return `<div class="rationale-box"><span class="rationale-h">${d.rationaleTitle}</span><ul class="rationale-ul">${items}</ul></div>`;
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  document.documentElement.lang = l;
  saveState();
  render();
}

function getModules() { return t().modules; }

function getModuleSteps(mIdx) {
  const mod = getModules()[mIdx];
  const steps = [];
  const intros = Array.isArray(mod.introSlides) ? mod.introSlides : [];
  intros.forEach((html, idx) => {
    steps.push({ type: 'intro', idx, html });
  });
  mod.questions.forEach((question, qIdx) => {
    steps.push({ type: 'question', qIdx, question });
    const between = mod.betweenQuestions && mod.betweenQuestions[qIdx];
    if (between) {
      steps.push({ type: 'interstitial', qIdx, html: between });
    }
  });
  return steps;
}

function getStepTitle(d, step) {
  if (!step) return '';
  if (step.type === 'intro') return d.stepOverview;
  if (step.type === 'interstitial') return d.stepCheckpoint;
  return `${d.questionLabel} ${step.qIdx + 1}`;
}

function countTotal() {
  let c = 0;
  getModules().forEach(m => c += m.questions.length);
  return c;
}

function getScore() {
  return answers.filter(a => a.correct).length;
}

function getAnsweredInModule(mIdx) {
  return answers.filter(a => a.moduleIdx === mIdx);
}

function allModuleAnswered(mIdx) {
  const mod = getModules()[mIdx];
  return getAnsweredInModule(mIdx).length === mod.questions.length;
}

function findAnswer(mIdx, qIdx) {
  return answers.find(a => a.moduleIdx === mIdx && a.questionIdx === qIdx);
}

function getModuleScore(mIdx) {
  return answers.filter(a => a.moduleIdx === mIdx && a.correct).length;
}

function getModuleTotal(mIdx) {
  return getModules()[mIdx].questions.length;
}

async function submitModuleToServer(mIdx) {
  if (!userCode || !serverModules[mIdx]) return;
  const score = getModuleScore(mIdx);
  const total = getModuleTotal(mIdx);
  const pct = total > 0 ? Math.round(score / total * 100) : 0;
  const timeSpent = Math.round((Date.now() - moduleStartTime) / 1000);

  try {
    await fetch(API_BASE + '/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: userCode,
        module_id: serverModules[mIdx].id,
        score: pct,
        time_spent_seconds: timeSpent
      })
    });
    submittedModules.add(mIdx);
    saveState();
  } catch (e) {
    console.warn('Failed to submit module:', e);
  }
}

function render() {
  totalQuestions = countTotal();
  document.body.classList.toggle('desktop-paged', !!userData);
  if (!userData) {
    renderError();
  } else if (currentModule === -1) {
    renderIntro();
  } else if (currentModule >= getModules().length) {
    renderResults();
  } else {
    renderModule(currentModule);
  }
}

function renderError() {
  const d = t();
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="error-screen">
      <h2>${d.errorTitle}</h2>
      <p>${d.errorMsg}</p>
    </div>`;
}

function renderIntro() {
  const d = t();
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="intro">
      <div class="intro-panel">
        <p class="welcome">${d.welcome} ${userData.name}</p>
        <h2>${d.startTitle}</h2>
        <p>${d.startDesc}</p>
        <button class="start-btn" onclick="startQuiz()">${d.startBtn}</button>
      </div>
    </div>`;
}

function startQuiz() {
  currentModule = 0;
  currentStep = 0;
  answers = [];
  submittedModules = new Set();
  moduleStartTime = Date.now();
  saveState();
  render();
}

function renderModule(mIdx) {
  const mod = getModules()[mIdx];
  const d = t();
  const steps = getModuleSteps(mIdx);
  currentStep = Math.max(0, Math.min(currentStep, steps.length - 1));
  const step = steps[currentStep];
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('navBar').style.display = 'flex';

  const answeredTotal = answers.length;
  const pct = totalQuestions > 0 ? (answeredTotal / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${d.moduleLabel} ${mIdx + 1} ${d.progressOf} ${getModules().length}`;
  document.getElementById('scoreText').textContent = `${d.score}: ${getScore()} / ${totalQuestions} ${d.pts}`;

  let stageHtml = '';
  if (step.type === 'intro') {
    stageHtml = `<section class="stage-card intro-slide-screen">
      <div class="intro-slide-body">${step.html}</div>
    </section>`;
  } else if (step.type === 'interstitial') {
    stageHtml = `<section class="stage-card interstitial-screen">
      <div class="module-content module-spacer">${step.html}</div>
    </section>`;
  } else {
    const question = step.question;
    const qIdx = step.qIdx;
    const prev = findAnswer(mIdx, qIdx);
    let questionHtml = `<div class="question-block single-question" id="q-${mIdx}-${qIdx}">
      <h3>${qIdx + 1}. ${question.q}</h3>
      <div class="options">`;
    question.opts.forEach((opt, oIdx) => {
      let cls = 'opt-btn';
      let disabled = '';
      if (prev) {
        disabled = 'disabled';
        if (oIdx === prev.selectedOpt && prev.correct) cls += ' selected-correct';
        else if (oIdx === prev.selectedOpt && !prev.correct) cls += ' selected-wrong';
        if (oIdx === question.correct && !prev.correct) cls += ' reveal-correct';
      }
      questionHtml += `<button class="${cls}" ${disabled} onclick="selectAnswer(${mIdx},${qIdx},${oIdx})">${opt}</button>`;
    });
    questionHtml += `</div>`;
    if (prev) {
      const fbClass = prev.correct ? 'correct' : 'wrong';
      const fbText = prev.correct ? question.feedback_correct : question.feedback_wrong;
      questionHtml += `<div class="feedback ${fbClass} show">${fbText}</div>`;
      questionHtml += buildRationaleHtml(question, prev);
    } else {
      questionHtml += `<div class="feedback" id="fb-${mIdx}-${qIdx}"></div>`;
    }
    questionHtml += `</div>`;
    stageHtml = `<section class="stage-card question-screen">
      <div class="question-main">${questionHtml}</div>
      <aside class="question-stats">
        <div class="question-stat">
          <span class="question-stat-label">${d.questionLabel}</span>
          <div class="question-stat-value">${qIdx + 1} / ${mod.questions.length}</div>
        </div>
        <div class="question-stat">
          <span class="question-stat-label">${d.pageLabel}</span>
          <div class="question-stat-value">${currentStep + 1} / ${steps.length}</div>
        </div>
        <div class="question-stat">
          <span class="question-stat-label">${d.questionsLabel}</span>
          <div class="question-stat-value">${getAnsweredInModule(mIdx).length} / ${mod.questions.length}</div>
        </div>
      </aside>
    </section>`;
  }

  let html = `<div class="module active">
    <div class="module-shell">
      <div class="module-head">
        <div style="min-width:0;flex:1">
          <div class="module-tag">${d.moduleLabel} ${mIdx + 1}</div>
          <div class="module-meta-row">
            <h2>${mod.title}</h2>
            <div class="step-caption">${getStepTitle(d, step)}</div>
          </div>
          <div class="step-track">
            ${steps.map((entry, idx) => {
              const cls = idx < currentStep ? 'step-dot done' : idx === currentStep ? 'step-dot current' : 'step-dot';
              return `<span class="${cls}">${idx + 1}</span>`;
            }).join('')}
          </div>
        </div>
        <div class="stage-pill">${d.pageLabel} ${currentStep + 1} / ${steps.length}</div>
      </div>
      ${stageHtml}
    </div>
  </div>`;
  document.getElementById('main').innerHTML = html;

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.textContent = d.prev;
  prevBtn.disabled = mIdx === 0 && currentStep === 0;

  const lastStepIdx = steps.length - 1;
  const isLastModule = mIdx === getModules().length - 1;
  const nextStep = steps[currentStep + 1];
  let nextLabel = d.next;
  let nextDisabled = false;
  if (step.type === 'intro') {
    if (nextStep && nextStep.type === 'intro') {
      nextLabel = d.continueBtn;
    } else {
      nextLabel = d.beginModule;
    }
  } else if (step.type === 'interstitial') {
    nextLabel = currentStep === lastStepIdx ? (isLastModule ? d.finish : d.nextModule) : d.continueBtn;
    nextDisabled = currentStep === lastStepIdx && !allModuleAnswered(mIdx);
  } else {
    nextDisabled = !findAnswer(mIdx, step.qIdx);
    if (currentStep === lastStepIdx) {
      nextLabel = isLastModule ? d.finish : d.nextModule;
    } else if (nextStep && nextStep.type === 'interstitial') {
      nextLabel = d.continueBtn;
    } else {
      nextLabel = d.nextQuestion;
    }
  }
  nextBtn.textContent = nextLabel;
  nextBtn.disabled = nextDisabled;
  nextBtn.classList.toggle('is-ready', !nextDisabled);

  document.getElementById('navScore').textContent = `${d.questionsLabel}: ${getAnsweredInModule(mIdx).length} / ${mod.questions.length}`;
}

function selectAnswer(mIdx, qIdx, oIdx) {
  if (findAnswer(mIdx, qIdx)) return;
  const question = getModules()[mIdx].questions[qIdx];
  const isCorrect = oIdx === question.correct;
  answers.push({ moduleIdx: mIdx, questionIdx: qIdx, selectedOpt: oIdx, correct: isCorrect });
  saveState();
  renderModule(mIdx);
}

async function goNext() {
  if (currentModule < 0) return;
  const steps = getModuleSteps(currentModule);
  const step = steps[currentStep];
  const isLastStep = currentStep >= steps.length - 1;
  if (step && step.type === 'question' && !findAnswer(currentModule, step.qIdx)) return;
  if (!isLastStep) {
    currentStep++;
    saveState();
    render();
    return;
  }
  if (!allModuleAnswered(currentModule)) return;
  if (currentModule >= 0 && !submittedModules.has(currentModule)) {
    await submitModuleToServer(currentModule);
  }
  currentModule++;
  currentStep = 0;
  moduleStartTime = Date.now();
  saveState();
  render();
}

function goBack() {
  if (currentModule < 0) return;
  if (currentStep > 0) {
    currentStep--;
    saveState();
    render();
    return;
  }
  if (currentModule > 0) {
    currentModule--;
    currentStep = Math.max(0, getModuleSteps(currentModule).length - 1);
    saveState();
    render();
  }
}

function renderResults() {
  const d = t();
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = d.resultsTitle;
  document.getElementById('scoreText').textContent = `${d.score}: ${getScore()} / ${totalQuestions} ${d.pts}`;

  const pct = totalQuestions > 0 ? Math.round(getScore() / totalQuestions * 100) : 0;
  let msg = d.resultsRetry;
  if (pct >= 80) msg = d.resultsGreat;
  else if (pct >= 50) msg = d.resultsGood;
  const badgeClass = pct >= 80 ? 'results-badge is-great' : pct >= 50 ? 'results-badge' : 'results-badge is-retry';
  const badgeIcon = pct >= 80 ? '🏆' : pct >= 50 ? '✨' : '💡';
  const scoreStyle = `--score-pct:${pct};`;

  const resultsGrid = getModules().map((mod, mIdx) => {
    const moduleScore = getModuleScore(mIdx);
    const moduleTotal = getModuleTotal(mIdx);
    const chipClass = moduleScore === moduleTotal ? 'result-chip is-perfect' : 'result-chip';
    return `<div class="${chipClass}">
      <strong>${d.moduleLabel} ${mIdx + 1}</strong>
      <span>${moduleScore} / ${moduleTotal}</span>
    </div>`;
  }).join('');
  const resultsBars = getModules().map((mod, mIdx) => {
    const moduleScore = getModuleScore(mIdx);
    const moduleTotal = getModuleTotal(mIdx);
    const modulePct = moduleTotal > 0 ? Math.round(moduleScore / moduleTotal * 100) : 0;
    return `<div class="result-bar">
      <div class="result-bar-top">
        <strong>${d.moduleLabel} ${mIdx + 1}</strong>
        <span>${moduleScore} / ${moduleTotal}</span>
      </div>
      <div class="result-bar-track">
        <div class="result-bar-fill" style="width:${modulePct}%"></div>
      </div>
    </div>`;
  }).join('');
  let keysHtml = d.keys.map(k => `<li>${k}</li>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="results-card" style="${scoreStyle}">
      <div class="results-hero">
        <div class="${badgeClass}">${badgeIcon}</div>
        <div class="results-subtitle">${d.resultsTitle}</div>
      </div>
      <div class="results-score-ring">
        <div class="results-score-inner">
          <strong>${pct}%</strong>
          <span>${getScore()} / ${totalQuestions}</span>
        </div>
      </div>
      <div class="score-msg">${msg}</div>
      <p class="results-summary">${d.resultsSummary}</p>
      <div class="results-grid">${resultsGrid}</div>
      <div class="results-bar-list">${resultsBars}</div>
      <div class="key-takeaways">
        <h3>${d.keyTitle}</h3>
        <ul>${keysHtml}</ul>
      </div>
      <div class="results-actions">
        <button type="button" class="restart-btn" onclick="restartQuiz()">${d.restart}</button>
      </div>
    </div>`;
}

function restartQuiz() {
  currentModule = -1;
  currentStep = 0;
  answers = [];
  submittedModules = new Set();
  clearState();
  render();
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  userCode = params.get('code');

  if (!userCode) {
    userData = null;
    render();
    return;
  }

  try {
    const res = await fetch(API_BASE + '/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: userCode })
    });

    if (!res.ok) {
      userData = null;
      render();
      return;
    }

    const data = await res.json();
    userData = data.user;
    quizData = data.quiz;
    serverModules = data.modules || [];

    document.getElementById('userBadge').textContent = userData.name;
    document.getElementById('userBadge').style.display = 'inline-block';

    const restored = loadState();
    if (restored) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.documentElement.lang = lang;
      moduleStartTime = Date.now();
    } else {
      currentModule = -1;
    }
    render();
  } catch (e) {
    console.warn('API not available, running in standalone mode');
    userData = null;
    render();
  }
}

init();
</script>
</body>
</html>
