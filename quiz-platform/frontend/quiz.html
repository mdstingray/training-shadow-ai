<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow AI — Formation Stingray</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#111111;--accent:#0070e0;--highlight:#41c3ff;--text:#ffffff;--card:#1a1a1a;--card-border:#2a2a2a;--correct:#22c55e;--wrong:#ef4444;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
a{color:var(--highlight)}

.app{max-width:720px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}

.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--card-border);margin-bottom:20px;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.15rem;font-weight:700;color:var(--highlight)}
.header-right{display:flex;align-items:center;gap:12px}
.user-badge{font-size:.8rem;color:#999;background:#1a1a1a;padding:4px 10px;border-radius:6px}
.lang-toggle{display:flex;gap:0;border:1px solid var(--accent);border-radius:6px;overflow:hidden}
.lang-btn{background:transparent;color:var(--text);border:none;padding:6px 14px;cursor:pointer;font-size:.85rem;font-weight:600;transition:background .2s}
.lang-btn.active{background:var(--accent)}

.progress-wrap{margin-bottom:24px}
.progress-label{font-size:.8rem;color:#999;margin-bottom:6px;display:flex;justify-content:space-between}
.progress-bar{height:6px;background:#333;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--highlight));border-radius:3px;transition:width .4s ease}

.module{display:none;animation:fadeIn .3s ease}
.module.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.module-tag{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--highlight);margin-bottom:4px}
.module h2{font-size:1.4rem;font-weight:700;margin-bottom:16px}
.module-content{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;margin-bottom:24px;font-size:.95rem;line-height:1.7}
.module-content p{margin-bottom:12px}
.module-content p:last-child{margin-bottom:0}
.module-content ul,.module-content ol{padding-left:20px;margin-bottom:12px}
.module-content li{margin-bottom:6px}
.key-msg{background:rgba(0,112,224,.12);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:.9rem}

.question-block{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.question-block h3{font-size:1rem;font-weight:600;margin-bottom:14px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{background:#222;border:2px solid #333;border-radius:8px;padding:12px 16px;color:var(--text);font-size:.9rem;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;line-height:1.4}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#1c1c1c}
.opt-btn:disabled{cursor:default;opacity:.85}
.opt-btn.selected-correct{border-color:var(--correct);background:rgba(34,197,94,.12)}
.opt-btn.selected-wrong{border-color:var(--wrong);background:rgba(239,68,68,.12)}
.opt-btn.reveal-correct{border-color:var(--correct);background:rgba(34,197,94,.08)}
.feedback{margin-top:12px;padding:12px 16px;border-radius:8px;font-size:.88rem;line-height:1.5;display:none}
.feedback.show{display:block}
.feedback.correct{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
.feedback.wrong{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}

.nav-bar{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding:20px 0 8px;gap:12px}
.nav-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
.nav-btn:hover{background:#005bb5}
.nav-btn:active{transform:scale(.97)}
.nav-btn:disabled{background:#333;color:#666;cursor:not-allowed}
.nav-btn.secondary{background:transparent;border:1px solid #444;color:#ccc}
.nav-btn.secondary:hover{border-color:var(--accent);color:#fff}

.score-display{text-align:center;font-size:.9rem;color:#aaa;padding:8px 0}

.results-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:20px}
.results-card .score-big{font-size:3rem;font-weight:800;color:var(--highlight);margin:12px 0}
.results-card .score-label{font-size:1rem;color:#aaa}
.results-card .score-msg{font-size:1.1rem;margin-top:16px;line-height:1.6}
.recap-list{text-align:left;margin-top:24px}
.recap-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:.88rem;line-height:1.5}
.recap-item:last-child{border-bottom:none}
.recap-icon{font-size:1.1rem;flex-shrink:0;margin-top:2px}
.recap-q{color:#ccc}
.key-takeaways{background:rgba(0,112,224,.08);border:1px solid rgba(0,112,224,.2);border-radius:var(--radius);padding:20px;margin-top:24px;text-align:left}
.key-takeaways h3{color:var(--highlight);margin-bottom:12px;font-size:1rem}
.key-takeaways li{margin-bottom:8px;font-size:.9rem;color:#ccc}

.intro{text-align:center;padding:40px 0}
.intro h2{font-size:1.8rem;margin-bottom:12px}
.intro p{color:#aaa;font-size:1rem;max-width:500px;margin:0 auto 24px;line-height:1.7}
.intro .welcome{color:var(--highlight);font-size:1.1rem;margin-bottom:8px}
.start-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:16px 48px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .2s,transform .1s}
.start-btn:hover{background:#005bb5}
.start-btn:active{transform:scale(.97)}

.error-screen{text-align:center;padding:80px 20px}
.error-screen h2{font-size:1.5rem;color:var(--wrong);margin-bottom:16px}
.error-screen p{color:#aaa;font-size:1rem}

.loading{text-align:center;padding:80px 20px;color:#666;font-size:1rem}

@media(max-width:480px){
  .app{padding:12px}
  .header h1{font-size:1rem}
  .module h2{font-size:1.2rem}
  .module-content{padding:16px}
  .question-block{padding:16px}
  .nav-btn{padding:12px 20px;font-size:.9rem}
  .results-card{padding:24px}
  .results-card .score-big{font-size:2.4rem}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <h1>🛡️ Shadow AI — Stingray</h1>
    <div class="header-right">
      <span class="user-badge" id="userBadge" style="display:none"></span>
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-label">
      <span id="progressText"></span>
      <span id="scoreText"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <main id="main">
    <div class="loading" id="loadingScreen">Chargement... / Loading...</div>
  </main>

  <div class="nav-bar" id="navBar" style="display:none">
    <button class="nav-btn secondary" id="prevBtn" onclick="goBack()"></button>
    <div class="score-display" id="navScore"></div>
    <button class="nav-btn" id="nextBtn" onclick="goNext()"></button>
  </div>
</div>

let lang = 'fr';
let currentModule = -1;
let answers = [];
let totalQuestions = 0;
let userCode = null;
let userData = null;
let quizData = null;
let serverModules = [];
let moduleStartTime = 0;
let submittedModules = new Set();

function storageKey() { return userCode ? 'quiz_state_' + userCode : null; }

function saveState() {
  const k = storageKey();
  if (!k) return;
  try {
    sessionStorage.setItem(k, JSON.stringify({
      currentModule, answers, submittedModules: [...submittedModules], lang
    }));
  } catch(e) {}
}

function loadState() {
  const k = storageKey();
  if (!k) return false;
  try {
    const raw = sessionStorage.getItem(k);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.answers && s.answers.length > 0) {
      answers = s.answers;
      currentModule = s.currentModule != null ? s.currentModule : -1;
      submittedModules = new Set(s.submittedModules || []);
      if (s.lang) { lang = s.lang; }
      return true;
    }
  } catch(e) {}
  return false;
}

function clearState() {
  const k = storageKey();
  if (k) try { sessionStorage.removeItem(k); } catch(e) {}
}

function t() { return QUIZ_DATA[lang]; }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  document.documentElement.lang = l;
  saveState();
  render();
}

function getModules() { return t().modules; }

function countTotal() {
  let c = 0;
  getModules().forEach(m => c += m.questions.length);
  return c;
}

function getScore() {
  return answers.filter(a => a.correct).length;
}

function getAnsweredInModule(mIdx) {
  return answers.filter(a => a.moduleIdx === mIdx);
}

function allModuleAnswered(mIdx) {
  const mod = getModules()[mIdx];
  return getAnsweredInModule(mIdx).length === mod.questions.length;
}

function findAnswer(mIdx, qIdx) {
  return answers.find(a => a.moduleIdx === mIdx && a.questionIdx === qIdx);
}

function getModuleScore(mIdx) {
  return answers.filter(a => a.moduleIdx === mIdx && a.correct).length;
}

function getModuleTotal(mIdx) {
  return getModules()[mIdx].questions.length;
}

async function submitModuleToServer(mIdx) {
  if (!userCode || !serverModules[mIdx]) return;
  const score = getModuleScore(mIdx);
  const total = getModuleTotal(mIdx);
  const pct = total > 0 ? Math.round(score / total * 100) : 0;
  const timeSpent = Math.round((Date.now() - moduleStartTime) / 1000);

  try {
    await fetch(API_BASE + '/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: userCode,
        module_id: serverModules[mIdx].id,
        score: pct,
        time_spent_seconds: timeSpent
      })
    });
    submittedModules.add(mIdx);
    saveState();
  } catch (e) {
    console.warn('Failed to submit module:', e);
  }
}

function render() {
  totalQuestions = countTotal();
  if (!userData) {
    renderError();
  } else if (currentModule === -1) {
    renderIntro();
  } else if (currentModule >= getModules().length) {
    renderResults();
  } else {
    renderModule(currentModule);
  }
}

function renderError() {
  const d = t();
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="error-screen">
      <h2>${d.errorTitle}</h2>
      <p>${d.errorMsg}</p>
    </div>`;
}

function renderIntro() {
  const d = t();
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('main').innerHTML = `
    <div class="intro">
      <p class="welcome">${d.welcome} ${userData.name}</p>
      <h2>${d.startTitle}</h2>
      <p>${d.startDesc}</p>
      <button class="start-btn" onclick="startQuiz()">${d.startBtn}</button>
    </div>`;
}

function startQuiz() {
  currentModule = 0;
  answers = [];
  submittedModules = new Set();
  moduleStartTime = Date.now();
  saveState();
  render();
}

function renderModule(mIdx) {
  const mod = getModules()[mIdx];
  const d = t();
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('navBar').style.display = 'flex';

  const answeredTotal = answers.length;
  const pct = totalQuestions > 0 ? (answeredTotal / totalQuestions * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${d.moduleLabel} ${mIdx + 1} ${d.progressOf} ${getModules().length}`;
  document.getElementById('scoreText').textContent = `${d.score}: ${getScore()} / ${totalQuestions} ${d.pts}`;

  let html = `<div class="module active">
    <div class="module-tag">${d.moduleLabel} ${mIdx + 1}</div>
    <h2>${mod.title}</h2>
    <div class="module-content">${mod.content}</div>`;

  mod.questions.forEach((question, qIdx) => {
    const prev = findAnswer(mIdx, qIdx);
    html += `<div class="question-block" id="q-${mIdx}-${qIdx}">
      <h3>${qIdx + 1}. ${question.q}</h3>
      <div class="options">`;
    question.opts.forEach((opt, oIdx) => {
      let cls = 'opt-btn';
      let disabled = '';
      if (prev) {
        disabled = 'disabled';
        if (oIdx === prev.selectedOpt && prev.correct) cls += ' selected-correct';
        else if (oIdx === prev.selectedOpt && !prev.correct) cls += ' selected-wrong';
        if (oIdx === question.correct && !prev.correct) cls += ' reveal-correct';
      }
      html += `<button class="${cls}" ${disabled} onclick="selectAnswer(${mIdx},${qIdx},${oIdx})">${opt}</button>`;
    });
    html += `</div>`;
    if (prev) {
      const fbClass = prev.correct ? 'correct' : 'wrong';
      const fbText = prev.correct ? question.feedback_correct : question.feedback_wrong;
      html += `<div class="feedback ${fbClass} show">${fbText}</div>`;
    } else {
      html += `<div class="feedback" id="fb-${mIdx}-${qIdx}"></div>`;
    }
    html += `</div>`;
  });

  html += `</div>`;
  document.getElementById('main').innerHTML = html;

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.textContent = d.prev;
  prevBtn.disabled = mIdx === 0;

  const isLast = mIdx === getModules().length - 1;
  nextBtn.textContent = isLast ? d.finish : d.next;
  nextBtn.disabled = !allModuleAnswered(mIdx);

  document.getElementById('navScore').innerHTML = '';
}

function selectAnswer(mIdx, qIdx, oIdx) {
  if (findAnswer(mIdx, qIdx)) return;
  const question = getModules()[mIdx].questions[qIdx];
  const isCorrect = oIdx === question.correct;
  answers.push({ moduleIdx: mIdx, questionIdx: qIdx, selectedOpt: oIdx, correct: isCorrect });
  saveState();
  renderModule(mIdx);
  const el = document.getElementById(`q-${mIdx}-${qIdx}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function goNext() {
  if (currentModule >= 0 && !allModuleAnswered(currentModule)) return;
  if (currentModule >= 0 && !submittedModules.has(currentModule)) {
    await submitModuleToServer(currentModule);
  }
  currentModule++;
  moduleStartTime = Date.now();
  saveState();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function goBack() {
  if (currentModule > 0) {
    currentModule--;
    saveState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }
}

function renderResults() {
  const d = t();
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = d.resultsTitle;
  document.getElementById('scoreText').textContent = `${d.score}: ${getScore()} / ${totalQuestions} ${d.pts}`;

  const pct = totalQuestions > 0 ? Math.round(getScore() / totalQuestions * 100) : 0;
  let msg = d.resultsRetry;
  if (pct >= 80) msg = d.resultsGreat;
  else if (pct >= 50) msg = d.resultsGood;

  let recapHtml = '';
  getModules().forEach((mod, mIdx) => {
    mod.questions.forEach((question, qIdx) => {
      const a = findAnswer(mIdx, qIdx);
      const icon = a && a.correct ? '✅' : '❌';
      const fbText = a ? (a.correct ? question.feedback_correct : question.feedback_wrong) : '';
      recapHtml += `<div class="recap-item">
        <span class="recap-icon">${icon}</span>
        <span class="recap-q"><strong>${d.moduleLabel} ${mIdx+1}, Q${qIdx+1}:</strong> ${question.q}<br><em>${fbText}</em></span>
      </div>`;
    });
  });

  let keysHtml = d.keys.map(k => `<li>${k}</li>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="results-card">
      <div class="score-label">${d.resultsTitle}</div>
      <div class="score-big">${getScore()} / ${totalQuestions}</div>
      <div class="score-label">${pct}%</div>
      <div class="score-msg">${msg}</div>
      <div class="recap-list">
        <h3 style="margin-bottom:12px;color:var(--highlight)">${d.recap}</h3>
        ${recapHtml}
      </div>
      <div class="key-takeaways">
        <h3>${d.keyTitle}</h3>
        <ul>${keysHtml}</ul>
      </div>
      <button class="restart-btn" onclick="restartQuiz()" style="margin-top:24px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:14px 36px;font-size:1rem;font-weight:600;cursor:pointer">${d.restart}</button>
    </div>`;
}

function restartQuiz() {
  currentModule = -1;
  answers = [];
  submittedModules = new Set();
  clearState();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  userCode = params.get('code');

  if (!userCode) {
    userData = null;
    render();
    return;
  }

  try {
    const res = await fetch(API_BASE + '/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: userCode })
    });

    if (!res.ok) {
      userData = null;
      render();
      return;
    }

    const data = await res.json();
    userData = data.user;
    quizData = data.quiz;
    serverModules = data.modules || [];

    document.getElementById('userBadge').textContent = userData.name;
    document.getElementById('userBadge').style.display = 'inline-block';

    const restored = loadState();
    if (restored) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.documentElement.lang = lang;
      moduleStartTime = Date.now();
    } else {
      currentModule = -1;
    }
    render();
  } catch (e) {
    console.warn('API not available, running in standalone mode');
    userData = null;
    render();
  }
}

init();
</script>
